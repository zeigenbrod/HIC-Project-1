```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customize Pizza - Kent Pizza</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Kent Pizza</h1>
    <p>Fresh pizza made your way</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="deals.html">Deals</a>
      <a href="account.html">Account</a>
    </nav>
  </header>

  <main>
    <h2>Customize Your Pizza</h2>

    <section class="featured">

<h3>Choose Your Pizza Size</h3>
<label for="pizzaSize">Pizza Size:</label>
<select id="pizzaSize">
  <option value="small" selected>Small - $8.99</option>
  <option value="medium">Medium - $12.99</option>
  <option value="large">Large - $15.99</option>
</select>

<h3>Choose Your Crust</h3>
<label for="pizzaCrust">Crust Type:</label>
<select id="pizzaCrust">
  <option value="thin" selected>Thin Crust</option>
  <option value="regular">Regular Crust</option>
  <option value="stuffed">Stuffed Crust (+$2.00)</option>
</select>

<h3>Choose Your Toppings</h3>
<label>
  <input type="checkbox" name="toppings"
         value="pepperoni" data-price="1.00">
  Pepperoni (+$1.00)
</label>
<br>

<label>
  <input type="checkbox" name="toppings"
         value="mushrooms" data-price="0.75">
  Mushrooms (+$0.75)
</label>
<br>

<label>
  <input type="checkbox" name="toppings"
         value="olives" data-price="0.75">
  Olives (+$0.75)
</label>
<br>

<label>
  <input type="checkbox" name="toppings"
         value="extra-cheese" data-price="1.00">
  Extra Cheese (+$1.00)
</label>

      <h3>Your Pizza Summary</h3>
      <p id="pizzaSummary">Small pizza with thin crust</p>
      <p id="pizzaPrice" class="price">Total: $8.99</p>

      <button type="button" onclick="undoPizza()">Undo Changes</button>
      <button type="button" onclick="addPizzaToCart()">Add to Cart</button>
      <p id="message"></p>

    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
